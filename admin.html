document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"ko\" translate=\"no\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"google\" content=\"notranslate\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script>/* 아라나비 홈페이지 데이터 연결 (GitHub 저장소의 data/site.json, images 폴더). 수정하지 않아도 됩니다. */\n(function () {\n  if (window.AranabiData) return;\n  var KEYS = { aranabi_board_v1: 'board', aranabi_popup_v1: 'popup', aranabi_status_v1: 'status' };\n  var TK = 'aranabi_gh_token', RK = 'aranabi_gh_repo', BK = 'aranabi_gh_branch';\n  var CFG = window.ARANABI_SITE || { branch: 'main' };\n  var S = Storage.prototype, oSet = S.setItem, oGet = S.getItem, oRem = S.removeItem;\n  var D = window.AranabiData = { images: {}, preview: {}, loaded: false };\n  window.__ARANABI_IMG = D.images;\n  function ls(k) { try { return oGet.call(localStorage, k); } catch (e) { return null; } }\n  function lsSet(k, v) { try { oSet.call(localStorage, k, v); } catch (e) {} }\n  function lsDel(k) { try { oRem.call(localStorage, k); } catch (e) {} }\n  function ev(name, detail) { try { window.dispatchEvent(new CustomEvent(name, { detail: detail })); } catch (e) {} }\n  function fire() { try { window.dispatchEvent(new Event('storage')); } catch (e) {} ev('aranabi-sync'); }\n  function base() { var p = location.pathname; return p.slice(0, p.lastIndexOf('/') + 1); }\n\n  // ── 방문객: 저장소의 최신 내용 불러오기 ──\n  D.ready = fetch(base() + 'data/site.json?v=' + Date.now(), { cache: 'no-store' })\n    .then(function (r) { return r.ok ? r.json() : null; })\n    .catch(function () { return null; })\n    .then(function (j) {\n      if (j && typeof j === 'object') {\n        for (var k in KEYS) { var v = j[KEYS[k]]; if (v != null) lsSet(k, JSON.stringify(v)); else lsDel(k); }\n        var im = j.images || {}; for (var id in D.images) delete D.images[id]; for (var id2 in im) D.images[id2] = im[id2];\n        D.site = j;\n      }\n      D.loaded = true; fire();\n    });\n\n  // ── 관리자: GitHub 연결 ──\n  D.conn = function () {\n    var t = ls(TK), r = ls(RK) || (CFG.owner && CFG.repo ? CFG.owner + '/' + CFG.repo : '');\n    return t && r ? { token: t, repo: r, branch: ls(BK) || CFG.branch || 'main' } : null;\n  };\n  D.repoHint = function () { return ls(RK) || (CFG.owner && CFG.repo ? CFG.owner + '/' + CFG.repo : (CFG.owner ? CFG.owner + '/' : '')); };\n  function api(method, path, body, token) {\n    var c = D.conn(); var h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', Authorization: 'Bearer ' + (token || (c && c.token)) };\n    if (body) h['Content-Type'] = 'application/json';\n    return fetch('https://api.github.com' + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' })\n      .then(function (r) {\n        if (r.status === 404 && method === 'GET') return null;\n        if (!r.ok) return r.text().then(function (t) { var e = new Error('GitHub ' + r.status + ': ' + t.slice(0, 160)); e.status = r.status; throw e; });\n        return r.status === 204 ? null : r.json();\n      });\n  }\n  function enc(path) { return path.split('/').map(encodeURIComponent).join('/'); }\n  function b64(str) { return btoa(unescape(encodeURIComponent(str))); }\n  function sha(path) { var c = D.conn(); return api('GET', '/repos/' + c.repo + '/contents/' + enc(path) + '?ref=' + encodeURIComponent(c.branch)).then(function (j) { return j && j.sha || null; }); }\n  function put(path, content64, msg) {\n    var c = D.conn();\n    return sha(path).then(function (s) {\n      var body = { message: msg, content: content64, branch: c.branch }; if (s) body.sha = s;\n      return api('PUT', '/repos/' + c.repo + '/contents/' + enc(path), body);\n    });\n  }\n  function del(path, msg) {\n    var c = D.conn();\n    return sha(path).then(function (s) { if (!s) return null; return api('DELETE', '/repos/' + c.repo + '/contents/' + enc(path), { message: msg, sha: s, branch: c.branch }); });\n  }\n  D.connect = function (token, repo) {\n    repo = String(repo || '').trim().replace(/^https?:\\/\\/github\\.com\\//, '').replace(/\\.git$/, '').replace(/\\/$/, '');\n    token = String(token || '').trim();\n    if (!/^[\\w.-]+\\/[\\w.-]+$/.test(repo)) return Promise.reject(new Error('저장소는 \"아이디/저장소이름\" 형식으로 입력해 주세요'));\n    if (!token) return Promise.reject(new Error('토큰을 입력해 주세요'));\n    return api('GET', '/repos/' + repo, null, token).then(function (info) {\n      if (!info) throw new Error('저장소를 찾지 못했어요. 이름과 토큰 권한을 확인해 주세요');\n      if (info.permissions && info.permissions.push === false) throw new Error('이 토큰으로는 저장할 수 없어요 (Contents 쓰기 권한 필요)');\n      lsSet(TK, token); lsSet(RK, repo); lsSet(BK, info.default_branch || 'main'); ev('aranabi-conn'); return info;\n    });\n  };\n  D.disconnect = function () { lsDel(TK); lsDel(RK); lsDel(BK); ev('aranabi-conn'); };\n\n  // ── 저장: data/site.json 한 파일에 모든 내용 ──\n  function parse(k) { try { return JSON.parse(ls(k) || 'null'); } catch (e) { return null; } }\n  function snapshot() {\n    var s = { v: 1, t: new Date().toISOString(), images: D.images };\n    for (var k in KEYS) s[KEYS[k]] = parse(k);\n    return s;\n  }\n  var chain = Promise.resolve(), timer = null;\n  D.saveSite = function (msg) {\n    if (!D.conn()) { ev('aranabi-saved', { ok: false, local: true, msg: 'GitHub 연결 전이라 이 기기에만 저장됐어요. [GitHub 연결] 메뉴에서 연결해 주세요' }); return Promise.resolve(false); }\n    ev('aranabi-saving');\n    chain = chain.then(function () { return put('data/site.json', b64(JSON.stringify(snapshot(), null, 1)), msg || '관리자: 홈페이지 내용 수정'); })\n      .then(function () { ev('aranabi-saved', { ok: true, msg: '깃허브에 저장했어요 · 1~2분 뒤 홈페이지에 반영돼요' }); return true; },\n            function (e) { ev('aranabi-saved', { ok: false, msg: (e && e.status === 401) ? '토큰이 만료됐거나 잘못됐어요. GitHub 연결을 다시 해 주세요' : '깃허브 저장에 실패했어요: ' + (e && e.message || '') }); return false; });\n    return chain;\n  };\n  function schedule() { clearTimeout(timer); timer = setTimeout(function () { D.saveSite(); }, 350); }\n  S.setItem = function (k, v) { oSet.call(this, k, v); if (this === localStorage && KEYS[k] && D.loaded) schedule(); };\n  S.removeItem = function (k) { oRem.call(this, k); if (this === localStorage && KEYS[k] && D.loaded) schedule(); };\n\n  // ── 사진 올리기: images 폴더에 새 파일로 저장 ──\n  function parts(dataUrl) { var m = /^data:image\\/([\\w+]+);base64,(.*)$/.exec(dataUrl || ''); if (!m) throw new Error('사진 형식을 읽지 못했어요'); return { ext: m[1] === 'jpeg' ? 'jpg' : m[1].replace('+xml', ''), b64: m[2] }; }\n  D.uploadFile = function (prefix, dataUrl) {\n    if (!D.conn()) return Promise.reject(new Error('GitHub 연결 후 사진을 올릴 수 있어요'));\n    var p = parts(dataUrl), path = 'images/' + prefix + '-' + Date.now().toString(36) + '.' + p.ext;\n    return put(path, p.b64, '관리자: 사진 올리기 (' + prefix + ')').then(function () { D.preview[path] = dataUrl; return path; });\n  };\n  D.removeFile = function (path) { if (!D.conn() || !/^images\\/[\\w-]+-[a-z0-9]+\\.\\w+$/.test(path || '')) return Promise.resolve(); return del(path, '관리자: 사용하지 않는 사진 정리').catch(function () {}); };\n  D.saveImage = function (id, dataUrl) {\n    var old = D.images[id] && D.images[id].u;\n    return D.uploadFile(id, dataUrl).then(function (path) {\n      D.images[id] = { u: path, s: 1, x: 0, y: 0 }; D.preview[id] = dataUrl; fire();\n      return D.saveSite('관리자: 사진 변경 (' + id + ')').then(function () { if (old && old !== path) D.removeFile(old); return path; });\n    });\n  };\n  D.removeImage = function (id) {\n    var old = D.images[id] && D.images[id].u; delete D.images[id]; delete D.preview[id]; fire();\n    return D.saveSite('관리자: 기본 사진으로 되돌리기 (' + id + ')').then(function () { if (old) D.removeFile(old); });\n  };\n  D.src = function (pathOrId) { return D.preview[pathOrId] || pathOrId; };\n  // ── 점검·설치용 ──\n  D.exists = function (path) { return sha(path).then(function (s) { return !!s; }); };\n  D.list = function (path) { var c = D.conn(); return api('GET', '/repos/' + c.repo + '/contents/' + enc(path || '') + '?ref=' + encodeURIComponent(c.branch)); };\n  D.putFile = function (path, content64, msg) { return put(path, content64, msg); };\n})();\n<\u002Fscript><script src=\"0298c928-2a17-411e-8f92-4f58a5b4f570\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<title>아라나비 관리자<\u002Ftitle>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap\">\n<style>\nbody{margin:0;background:oklch(0.97 0.006 240);color:oklch(0.24 0.03 245);font-family:\"Pretendard Variable\",Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}\na{color:inherit;text-decoration:none}\na:hover{color:oklch(0.55 0.12 235)}\n*{box-sizing:border-box}\ninput,textarea,button{font-family:inherit}\n@media (max-width:860px){.adm-grid{grid-template-columns:minmax(0,1fr)!important}.adm-aside{position:static!important;height:auto!important;padding:16px!important;gap:12px!important}.adm-aside nav{flex-direction:row!important;flex-wrap:wrap}.adm-aside nav button{gap:8px}.adm-main{padding:24px 16px 60px!important}.adm-two{grid-template-columns:minmax(0,1fr)!important}.adm-two>div[style*=\"sticky\"]{position:static!important}.adm-row{grid-template-columns:34px minmax(0,1fr) auto!important;gap:10px!important;padding-left:14px!important;padding-right:14px!important}.adm-row>span:nth-child(2),.adm-row>span:nth-child(4),.adm-row>span:nth-child(5),.adm-row>span:nth-child(6){display:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ notAuthed }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px\">\n    <div style=\"width:min(400px,100%);background:#fff;border-radius:24px;padding:44px 40px;box-shadow:0 12px 40px oklch(0.24 0.03 245 / 0.08);display:flex;flex-direction:column;gap:16px\">\n }\" placeholder=\"예) 강풍, 정기 점검, 우천\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;outline:none;color:inherit\">\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;flex-direction:column;gap:12px;padding-bottom:22px;border-bottom:1px solid oklch(0.24 0.03 245 / 0.08)\">\n              <span style=\"font-size:16px;font-weight:800\">날씨 표시<\u002Fspan>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <sc-for list=\"{{ wxOpts }}\" as=\"o\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ wxManual }}\" hint-placeholder-val=\"{{ false }}\">\n                <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">날씨 문구\n                  <input value=\"{{ st.wx }}\" sc-camel-on-change=\"{{ onWx }}\" placeholder=\"예) 맑음 · 15°C · 바람 6m/s\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;outline:none;color:inherit\">\n                <\u002Flabel>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">한 줄 안내 (선택)\n              <input value=\"{{ st.note }}\" sc-camel-on-change=\"{{ onStNote }}\" placeholder=\"예) 오늘은 16시에 매표 마감합니다\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;outline:none;color:inherit\">\n            <\u002Flabel>\n            <span style=\"font-size:13px;opacity:0.55;line-height:1.6\">저장한 내용은 저장한 날 하루만 적용돼요. 다음 날에는 자동 표시(정상 운영 + 실시간 날씨, 강풍 시 짚라인 <sc-if value=\"{{ isMap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:20px;max-width:860px\">\n          <div style=\"background:#fff;border-radius:20px;padding:24px 28px;border:1px solid oklch(0.24 0.03 245 / 0.06);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.7\">\n            <span>홈페이지 주소 뒤에 <b>#numbers<\u002Fb>를 붙여 열면(아래 버튼) 화면 위에 번호표가 붙어요. <b style=\"color:#c62a30\">빨강<\u002Fb>은 구역, <b style=\"color:#1f5fd6\">파랑<\u002Fb>은 사진, <b style=\"color:#1e8a46\">초록<\u002Fb>은 공지·리뷰 번호예요.<\u002Fspan>\n            <span style=\"opacity:0.7\">예) \"구역 4 제목 문구를 바꿔줘\", \"사진 3을 새 사진으로\", \"공지 2 내용 수정\", \"리뷰 1 숨기기\"<\u002Fspan>\n            <a href=\"{{ numbersUrl }}\" target=\"_blank\" style=\"align-self:flex-start;font-size:14px;font-weight:700;padding:12px 18px;border-radius:12px;background:oklch(0.3 0.05 240);color:#fff\">홈페이지에서 번호 보기 ↗<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start\">\n            <div style=\"background:#fff;border-radius:20px;border:1px solid oklch(0.24 0.03 245 / 0.06);overflow:hidden\">\n              <div style=\"padding:16px 20px;font-size:15px;font-weight:800;border-bottom:1px solid oklch(0.24 0.03 245 / 0.08)\">구역 번호<\u002Fdiv>\n              <sc-for list=\"{{ locRows }}\" as=\"l\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 20px;border-bottom:1px solid oklch(0.24 0.03 245 / 0.05);font-size:14px\">\n                  <span style=\"font-weight:800;color:#c62a30\">구역 {{ l.n }}<\u002Fspan><span style=\"font-weight:600\">{{ l.name }}<\u002Fspan><span style=\"font-size:12px;opacity:0.6\">{{ l.page }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border-radius:20px;border:1px solid oklch(0.24 0.03 245 / 0.06);overflow:hidden\">\n              <div style=\"padding:16px 20px;font-size:15px;font-weight:800;border-bottom:1px solid oklch(0.24 0.03 245 / 0.08)\">사진 번호<\u002Fdiv>\n              <sc-for list=\"{{ photoRows }}\" as=\"p\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center;padding:11px 20px;border-bottom:1px solid oklch(0.24 0.03 245 / 0.05);font-size:14px\">\n                  <span style=\"font-weight:800;color:#1f5fd6\">사진 {{ p.n }}<\u002Fspan><span style=\"font-weight:600\">{{ p.name }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"padding:14px 20px;font-size:13px;opacity:0.65;line-height:1.6\">공지·리뷰 번호는 각 메뉴 목록의 '번호' 칸과 같아요.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPhotos }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px\">\n            <sc-for list=\"{{ photoCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"background:#fff;border-radius:16px;overflow:hidden;border:1px solid oklch(0.24 0.03 245 / 0.08);display:flex;flex-direction:column\">\n                <div style=\"aspect-ratio:4/3;background:oklch(0.92 0.02 230);position:relative;display:flex;align-items:center;justify-content:center;font-size:13px;color:oklch(0.4 0.02 240)\">\n                  <sc-if value=\"{{ c.has }}\" hint-placeholder-val=\"{{ true }}\"><img src=\"{{ c.src }}\" alt=\"{{ c.name }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\"><\u002Fsc-if>\n                  <sc-if value=\"{{ c.none }}\" hint-placeholder-val=\"{{ false }}\"><span>사진 없음<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:10px\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\"><strong style=\"font-size:15px\">{{ c.name }}<\u002Fstrong><span style=\"{{ c.tagStyle }}\">{{ c.tag }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;gap:8px\">\n                    <label style=\"position:relative;flex:1;text-align:center;font-size:14px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;background:oklch(0.3 0.05 240);color:#fff\">사진 바꾸기<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ c.onFile }}\" style=\"position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer\"><\u002Flabel>\n                    <sc-if value=\"{{ c.canReset }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ c.reset }}\" style=\"font-size:13px;font-weight:600;padding:11px 12px;border-radius:10px;border:1px solid oklch(0.24 0.03 245 / 0.2);background:none;color:inherit;cursor:pointer\">기본 사진으로<\u002Fbutton><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"font-size:13px;opacity:0.65;line-height:1.6\">휴대폰으로 찍은 큰 사진도 알맞은 크기로 줄여서 깃허브 images 폴더에 저장해요. 홈페이지에는 1~2분 뒤 반영됩니다.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isGithub }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start;max-width:1000px\">\n          <div style=\"background:#fff;border-radius:20px;padding:28px;border:1px solid oklch(0.24 0.03 245 / 0.06);display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span style=\"font-size:16px;font-weight:800\">연결 상태<\u002Fspan><span style=\"{{ ghTagStyle }}\">{{ ghTag }}<\u002Fspan><\u002Fdiv>\n            <sc-if value=\"{{ ghOn }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:14px;line-height:1.6\">저장소 <b>{{ ghRepo }}<\u002Fb> 에 저장하고 있어요.<\u002Fspan><\u002Fsc-if>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">저장소 (아이디/저장소이름)\n              <input value=\"{{ ghRepoInput }}\" sc-camel-on-change=\"{{ onGhRepo }}\" placeholder=\"예) aranabygn/aranabi-home\" autocomplete=\"off\" style=\"padding:13px 15px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;outline:none;color:inherit\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">토큰 (Fine-grained personal access token)\n              <input type=\"password\" value=\"{{ ghTokenInput }}\" sc-camel-on-change=\"{{ onGhToken }}\" placeholder=\"github_pat_로 시작\" autocomplete=\"off\" style=\"padding:13px 15px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;outline:none;color:inherit\">\n            <\u002Flabel>\n            <sc-if value=\"{{ ghHasErr }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:oklch(0.48 0.19 25);line-height:1.5\">{{ ghErr }}<\u002Fspan><\u002Fsc-if>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <button type=\"button\" sc-camel-on-click=\"{{ ghConnect }}\" style=\"font-size:14px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;border:none;background:oklch(0.3 0.05 240);color:#fff\">연결하기<\u002Fbutton>\n              <sc-if value=\"{{ ghOn }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ ghDisconnect }}\" style=\"font-size:14px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;border:1px solid oklch(0.24 0.03 245 / 0.2);background:none;color:inherit\">연결 해제<\u002Fbutton><\u002Fsc-if>\n              <sc-if value=\"{{ ghOn }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ ghSaveAll }}\" style=\"font-size:14px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;border:1px solid oklch(0.24 0.03 245 / 0.2);background:none;color:inherit\">지금 내용 전체 저장<\u002Fbutton><\u002Fsc-if>\n            <\u002Fdiv>\n            <span style=\"font-size:12px;opacity:0.6;line-height:1.6\">토큰은 이 기기의 브라우저에만 보관되고, 홈페이지 파일이나 저장소에는 들어가지 않아요. 다른 기기에서 관리하려면 그 기기에서도 한 번 연결해 주세요.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border-radius:20px;padding:28px;border:1px solid oklch(0.24 0.03 245 / 0.06);display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.7\">\n            <span style=\"font-size:16px;font-weight:800;margin-bottom:4px\">토큰 만드는 방법 (처음 한 번)<\u002Fspan>\n            <span>1. github.com 오른쪽 위 프로필 → <b>Settings<\u002Fb><\u002Fspan>\n            <span>2. 왼쪽 맨 아래 <b>Developer settings<\u002Fb> → <b>Personal access tokens<\u002Fb> → <b>Fine-grained tokens<\u002Fb><\u002Fspan>\n            <span>3. <b>Generate new token<\u002Fb> → 이름: 아라나비 관리자, 기간: 원하는 만큼(최대 1년)<\u002Fspan>\n            <span>4. <b>Repository access<\u002Fb>: Only select repositories → 홈페이지 저장소 선택<\u002Fspan>\n            <span>5. <b>Permissions<\u002Fb> → Repository permissions → <b>Contents: Read and write<\u002Fb><\u002Fspan>\n            <span>6. <b>Generate token<\u002Fb> → 나온 토큰(github_pat_…)을 복사해 왼쪽에 붙여 넣고 <b>연결하기<\u002Fb><\u002Fspan>\n            <span style=\"opacity:0.65;font-size:13px\">토큰은 비밀번호와 같아요. 다른 사람에게 보내지 마세요. 기간이 끝나면 새로 만들어 다시 연결하면 됩니다.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:20px;padding:28px;border:1px solid oklch(0.24 0.03 245 / 0.06);display:flex;flex-direction:column;gap:14px;max-width:1000px;margin-top:20px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\">\n            <span style=\"font-size:16px;font-weight:800\">홈페이지 점검<\u002Fspan>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <button type=\"button\" sc-camel-on-click=\"{{ runCheck }}\" style=\"font-size:14px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;border:1px solid oklch(0.24 0.03 245 / 0.2);background:none;color:inherit\">{{ checkLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ canInstall }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ installMissing }}\" style=\"font-size:14px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;border:none;background:oklch(0.3 0.05 240);color:#fff\">빠진 파일 자동 설치 ({{ missingCount }}개)<\u002Fbutton><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size:13px;opacity:0.65;line-height:1.6\">지금 홈페이지에 최신 파일과 사진이 제자리에 올라가 있는지 확인해요. GitHub를 연결하면 빠진 사진·파일을 자동으로 올릴 수 있어요.<\u002Fspan>\n          <sc-for list=\"{{ checks }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;padding:12px 0;border-top:1px solid oklch(0.24 0.03 245 / 0.07);font-size:14px\">\n              <span style=\"{{ c.badgeStyle }}\">{{ c.badge }}<\u002Fspan>\n              <span style=\"font-weight:700\">{{ c.name }}<\u002Fspan>\n              <span><\u002Fspan>\n              <span style=\"font-size:13px;opacity:0.7;line-height:1.5\">{{ c.note }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPopup }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"adm-two\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start\">\n          <div style=\"background:#fff;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:18px;border:1px solid oklch(0.24 0.03 245 / 0.06)\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:18px;border-bottom:1px solid oklch(0.24 0.03 245 / 0.08)\">\n              <div style=\"display:flex;flex-direction:column;gap:4px\">\n                <span style=\"font-size:15px;font-weight:700\">홈페이지에 팝업 띄우기<\u002Fspan>\n                <span style=\"font-size:13px;opacity:0.6\">끄면 기간과 상관없이 팝업이 뜨지 않아요<\u002Fspan>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ toggleOn }}\" style=\"{{ toggleStyle }}\">{{ onLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">제목\n              <input value=\"{{ pc.title }}\" sc-camel-on-change=\"{{ onPTitle }}\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;outline:none;color:inherit\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">내용\n              <textarea value=\"{{ pc.body }}\" sc-camel-on-change=\"{{ onPBody }}\" rows=\"4\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;line-height:1.6;outline:none;color:inherit;resize:vertical\"><\u002Ftextarea>\n            <\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n              <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">시작일\n                <input type=\"date\" value=\"{{ pc.start }}\" sc-camel-on-change=\"{{ onPStart }}\" style=\"padding:13px 14px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;outline:none;color:inherit\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">종료일\n                <input type=\"date\" value=\"{{ pc.end }}\" sc-camel-on-change=\"{{ onPEnd }}\" style=\"padding:13px 14px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;outline:none;color:inherit\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">팝업 이미지 (세로 4:5 권장)\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <label style=\"position:relative;font-size:14px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;background:oklch(0.3 0.05 240);color:#fff\">이미지 올리기<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ popImg.onFile }}\" style=\"position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer\"><\u002Flabel>\n                <sc-if value=\"{{ popImg.canReset }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ popImg.reset }}\" style=\"font-size:13px;font-weight:600;padding:11px 14px;border-radius:10px;border:1px solid oklch(0.24 0.03 245 / 0.2);background:none;color:inherit;cursor:pointer\">이미지 빼기<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size:13px;opacity:0.55;line-height:1.6\">기간을 비워두면 계속 노출돼요. 이미지는 올리는 즉시 깃허브에 저장되고, 제목·내용·기간은 저장하기를 눌러야 저장돼요.<\u002Fspan>\n            <div style=\"display:flex;justify-content:flex-end;margin-top:6px\">\n              <button sc-camel-on-click=\"{{ savePopup }}\" style=\"font-size:15px;font-weight:700;padding:14px 28px;border-radius:12px;border:none;background:oklch(0.3 0.05 240);color:#fff;cursor:pointer\">저장하기<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;position:sticky;top:44px\">\n            <span style=\"font-size:13px;font-weight:700;opacity:0.55\">미리보기 · {{ popupStatus }}<\u002Fspan>\n            <div style=\"background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 16px 40px oklch(0.24 0.03 245 / 0.12)\">\n              <div style=\"aspect-ratio:5/4;background:oklch(0.9 0.02 230);position:relative;display:flex;align-items:center;justify-content:center;font-size:13px;color:oklch(0.45 0.02 240)\"><sc-if value=\"{{ popImg.has }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ popImg.src }}\" alt=\"팝업 이미지\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\"><\u002Fsc-if><sc-if value=\"{{ popImg.none }}\" hint-placeholder-val=\"{{ true }}\"><span>팝업 이미지 없음<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n              <div style=\"padding:22px 24px;display:flex;flex-direction:column;gap:8px\">\n                <strong style=\"font-size:18px;font-weight:800\">{{ pc.title }}<\u002Fstrong>\n                <span style=\"font-size:14px;line-height:1.6;opacity:0.7;white-space:pre-wrap\">{{ pc.body }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;border-top:1px solid oklch(0.24 0.03 245 / 0.1);font-size:13px;text-align:center\">\n                <span style=\"padding:14px;opacity:0.6;border-right:1px solid oklch(0.24 0.03 245 / 0.1)\">오늘 하루 보지 않기<\u002Fspan>\n                <span style=\"padding:14px;font-weight:700\">닫기<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isEditing }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-radius:20px;padding:36px;display:flex;flex-direction:column;gap:18px;border:1px solid oklch(0.24 0.03 245 / 0.06);max-width:860px\">\n          <h2 style=\"margin:0 0 4px;font-size:20px;font-weight:800\">{{ editTitle }}<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px\">\n            <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"2\">\n              <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">{{ f.label }}\n                <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.ph }}\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;outline:none;color:inherit\">\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:700\">내용\n            <textarea value=\"{{ editBody }}\" sc-camel-on-change=\"{{ onEBody }}\" rows=\"10\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.15);background:oklch(0.985 0.005 230);font-size:15px;line-height:1.7;outline:none;color:inherit;resize:vertical\"><\u002Ftextarea>\n          <\u002Flabel>\n          <sc-if value=\"{{ canImg }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:10px;font-size:13px;font-weight:700\">이미지 (선택)\n              <sc-if value=\"{{ editImg.has }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ editImg.src }}\" alt=\"첨부 이미지\" style=\"max-width:320px;width:100%;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.1)\"><\u002Fsc-if>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <label style=\"position:relative;font-size:14px;font-weight:700;padding:11px 16px;border-radius:10px;cursor:pointer;background:oklch(0.3 0.05 240);color:#fff\">{{ editImg.label }}<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ editImg.onFile }}\" style=\"position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer\"><\u002Flabel>\n                <sc-if value=\"{{ editImg.has }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ editImg.remove }}\" style=\"font-size:13px;font-weight:600;padding:11px 14px;border-radius:10px;border:1px solid oklch(0.24 0.03 245 / 0.2);background:none;color:inherit;cursor:pointer\">이미지 빼기<\u002Fbutton><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;justify-content:flex-end;gap:8px\">\n            <button sc-camel-on-click=\"{{ cancelEdit }}\" style=\"font-size:15px;font-weight:600;padding:14px 22px;border-radius:12px;border:1px solid oklch(0.24 0.03 245 / 0.2);background:none;color:inherit;cursor:pointer\">취소<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ saveEdit }}\" style=\"font-size:15px;font-weight:700;padding:14px 28px;border-radius:12px;border:none;background:oklch(0.3 0.05 240);color:#fff;cursor:pointer\">저장하기<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isList }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border-radius:20px;border:1px solid oklch(0.24 0.03 245 / 0.06);overflow:hidden\">\n          <div class=\"adm-row\" style=\"display:grid;grid-template-columns:44px 100px minmax(0,1fr) 110px 96px 80px 210px;gap:16px;padding:16px 24px;font-size:12px;font-weight:700;opacity:0.5;border-bottom:1px solid oklch(0.24 0.03 245 / 0.08)\">\n            <span>번호<\u002Fspan><span>분류<\u002Fspan><span>제목<\u002Fspan><span>날짜<\u002Fspan><span>구분<\u002Fspan><span>상태<\u002Fspan><span style=\"text-align:right\">관리<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div class=\"adm-row\" style=\"display:grid;grid-template-columns:44px 100px minmax(0,1fr) 110px 96px 80px 210px;gap:16px;align-items:center;padding:18px 24px;border-bottom:1px solid oklch(0.24 0.03 245 / 0.06);font-size:14px\">\n              <span
